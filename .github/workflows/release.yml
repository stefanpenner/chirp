name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cache sherpa-onnx libraries
        uses: actions/cache@v4
        with:
          path: Frameworks/lib
          key: sherpa-onnx-libs-v1.12.24

      - name: Download dependencies
        run: |
          if [ ! -f Frameworks/lib/libsherpa-onnx-c-api.dylib ]; then
            mkdir -p Frameworks/lib
            curl -L "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.24/sherpa-onnx-v1.12.24-onnxruntime-1.23.2-osx-universal2-shared.tar.bz2" \
              -o /tmp/sherpa-onnx-shared.tar.bz2
            tar xjf /tmp/sherpa-onnx-shared.tar.bz2 -C /tmp/
            cp /tmp/sherpa-onnx-v1.12.24-onnxruntime-1.23.2-osx-universal2-shared/lib/libsherpa-onnx-c-api.dylib Frameworks/lib/
            cp /tmp/sherpa-onnx-v1.12.24-onnxruntime-1.23.2-osx-universal2-shared/lib/libonnxruntime.1.23.2.dylib Frameworks/lib/
            ln -sf libonnxruntime.1.23.2.dylib Frameworks/lib/libonnxruntime.dylib
          fi

      - name: Build and package
        run: scripts/package.sh ${{ steps.version.outputs.version }}

      - name: Compute DMG SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "dist/Chirp-v${{ steps.version.outputs.version }}-macOS.dmg" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Chirp-v${{ steps.version.outputs.version }}-macOS.dmg

      - name: Update Sparkle appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/update-appcast.sh "$VERSION" "dist/Chirp-v${VERSION}-macOS.dmg"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Update appcast for v${VERSION}" || true
          git push origin HEAD:main || true

      - name: Update Homebrew tap
        if: "${{ secrets.HOMEBREW_TAP_TOKEN != '' }}"
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/stefanpenner/homebrew-chirp.git" /tmp/homebrew-chirp
          cd /tmp/homebrew-chirp
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/chirp.rb
          sed -i '' "s/sha256 .*/sha256 \"${SHA}\"/" Casks/chirp.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/chirp.rb
          git commit -m "Update Chirp to v${VERSION}"
          git push
