name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so release metadata is complete (appcast build
          # numbers no longer rely on tag count, but homebrew/notes may).
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Import code-signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Extract Developer ID Application identity (required for notarization)
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: No 'Developer ID Application' certificate found in keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "CHIRP_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          echo "Signing identity: $IDENTITY"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "chirp-notarize" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"
          echo "CHIRP_NOTARIZE_PROFILE=chirp-notarize" >> "$GITHUB_ENV"

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'deps.bzl') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Cache dependencies (sherpa-onnx, models, Sparkle)
        uses: actions/cache@v4
        with:
          path: |
            Frameworks/lib
            Frameworks/Sparkle.framework
            models
          key: deps-${{ runner.os }}-sherpa-v1.12.24-sparkle-2.8.1

      - name: Calculate build number
        id: build
        run: |
          # Monotonic CFBundleVersion / sparkle:version from semver X.Y.Z
          # (tag-count broke under shallow clones → every release was build "2")
          VERSION="${{ steps.version.outputs.version }}"
          # Inline same formula as package.sh compute_build_number
          IFS=. read -r MAJ MIN PAT <<<"$VERSION"
          MAJ=${MAJ//[^0-9]/}; MIN=${MIN//[^0-9]/}; PAT=${PAT//[^0-9]/}
          BUILD=$((10#${MAJ:-0} * 1000000 + 10#${MIN:-0} * 1000 + 10#${PAT:-0}))
          if [[ "$BUILD" -lt 2 ]]; then
            echo "ERROR: build number $BUILD too small for version $VERSION"
            exit 1
          fi
          echo "number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build number: $BUILD (from semver $VERSION)"

      - name: Free disk space
        run: |
          # macOS runners fill up during bazel + notarize; free non-essential caches
          df -h /
          rm -rf "$HOME/Library/Caches/Homebrew"/* 2>/dev/null || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/* 2>/dev/null || true
          # Drop old bazel outputs if present (rebuild already done after)
          rm -rf /tmp/Sparkle* /tmp/sparkle* 2>/dev/null || true
          df -h /

      - name: Build and package
        run: scripts/package.sh ${{ steps.version.outputs.version }} ${{ steps.build.outputs.number }}

      - name: Compute DMG SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 "dist/Chirp-v${{ steps.version.outputs.version }}-macOS.dmg" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Chirp-v${{ steps.version.outputs.version }}-macOS.dmg
          tag_name: v${{ steps.version.outputs.version }}

      - name: Update Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_PATH="dist/Chirp-v${VERSION}-macOS.dmg"
          # Checkout main so we can push (tag builds run on detached HEAD)
          git fetch origin main
          git checkout main
          # Optional EdDSA: download sign_update if private key present
          if [[ -n "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            curl -fsSL -o /tmp/Sparkle.tgz \
              "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz"
            mkdir -p /tmp/sparkle-bin
            tar xf /tmp/Sparkle.tgz -C /tmp/sparkle-bin
            export SPARKLE_SIGN_UPDATE="$(find /tmp/sparkle-bin -name sign_update -type f | head -1)"
            echo "Using sign_update: $SPARKLE_SIGN_UPDATE"
          else
            echo "WARNING: SPARKLE_PRIVATE_KEY secret not set — appcast will lack edSignature"
          fi
          scripts/update-appcast.sh "$VERSION" "$DMG_PATH" "${{ steps.build.outputs.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for v${VERSION}"
          git push origin main

      - name: Update Homebrew tap
        if: env.DEPLOY_KEY != ''
        run: |
          eval "$(ssh-agent -s)"
          echo "$DEPLOY_KEY" | ssh-add -
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          git clone git@github.com:stefanpenner/homebrew-chirp.git /tmp/homebrew-chirp
          cd /tmp/homebrew-chirp
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/chirp.rb
          sed -i '' "s/sha256 .*/sha256 \"${SHA}\"/" Casks/chirp.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/chirp.rb
          git commit -m "Update Chirp to v${VERSION}"
          git push

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
