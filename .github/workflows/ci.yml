name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache Frameworks
        uses: actions/cache@v4
        with:
          path: |
            Frameworks/lib
            Frameworks/Sparkle.framework
          key: frameworks-sherpa-v1.12.24-sparkle-2.8.1

      - name: Download dependencies
        run: scripts/setup.sh

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //...
